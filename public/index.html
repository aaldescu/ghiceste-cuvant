<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ghicește cuvântul</title>
<style>
  :root {
    --bg: #f6f5f1; --panel: #ffffff; --text: #1d1d1b; --muted: #6b6a66;
    --accent: #c2572b; --bot: #efece4; --me: #c2572b; --me-text: #fff; --border: #e2dfd6;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1a1918; --panel: #232220; --text: #eeece6; --muted: #9d9a92;
      --accent: #e07a4f; --bot: #2e2c29; --me: #b8532a; --me-text: #fff; --border: #3a3834;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 640px; margin: 0 auto; padding: 16px; min-height: 100vh;
    display: flex; flex-direction: column; gap: 12px; }
  header h1 { margin: 8px 0 0; font-size: 1.5rem; }
  header p { margin: 4px 0 0; color: var(--muted); font-size: .95rem; }
  #chat { flex: 1; display: flex; flex-direction: column; gap: 8px; padding: 8px 0; }
  .msg { max-width: 85%; padding: 10px 14px; border-radius: 16px; white-space: pre-wrap; }
  .bot { background: var(--bot); align-self: flex-start; border-bottom-left-radius: 4px; }
  .me { background: var(--me); color: var(--me-text); align-self: flex-end; border-bottom-right-radius: 4px; }
  .meta { font-size: .8rem; color: var(--muted); align-self: flex-start; margin-top: -4px; }
  .error { color: #d33; font-size: .9rem; }
  #panel { position: sticky; bottom: 0; background: var(--bg); padding: 8px 0 16px;
    display: flex; flex-direction: column; gap: 8px; }
  .buttons { display: flex; flex-wrap: wrap; gap: 8px; }
  button { font: inherit; border: 1px solid var(--border); background: var(--panel); color: var(--text);
    padding: 8px 14px; border-radius: 999px; cursor: pointer; }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  button:disabled { opacity: .5; cursor: default; }
  form { display: flex; gap: 8px; }
  #text { flex: 1; min-width: 0; font: inherit; padding: 8px 14px; border-radius: 999px;
    border: 1px solid var(--border); background: var(--panel); color: var(--text); }
  label.hint { font-size: .85rem; color: var(--muted); display: flex; gap: 6px; align-items: center; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Ghicește cuvântul</h1>
    <p>Gândește-te la un cuvânt și nu-l scrie nicăieri. Eu pun întrebări și încerc să-l ghicesc.</p>
  </header>

  <div id="chat" aria-live="polite"></div>

  <div id="panel">
    <div class="buttons" id="answers"></div>
    <form id="free">
      <input id="text" placeholder="Sau răspunde liber…" autocomplete="off" maxlength="300">
      <button type="submit">Trimite</button>
    </form>
    <label class="hint"><input type="checkbox" id="showCandidates"> Arată la ce cuvinte mă gândesc</label>
  </div>
</main>

<script>
  const QUESTION_ANSWERS = ["Da", "Nu", "Nu știu", "Probabil", "Probabil nu"];
  const GUESS_ANSWERS = ["Da, ai ghicit!", "Nu"];

  const chat = document.getElementById("chat");
  const answers = document.getElementById("answers");
  const form = document.getElementById("free");
  const textInput = document.getElementById("text");
  const showCandidates = document.getElementById("showCandidates");

  // Istoria e ținută doar în memorie, în pagină. Cuvântul jucătorului nu apare nicăieri.
  let history = [];
  let busy = false;
  let lastTurn = null;

  function addBubble(text, who) {
    const div = document.createElement("div");
    div.className = "msg " + who;
    div.textContent = text;
    chat.appendChild(div);
    div.scrollIntoView({ behavior: "smooth", block: "end" });
    return div;
  }

  function addMeta(turn) {
    if (!showCandidates.checked || !turn.candidates?.length) return;
    const div = document.createElement("div");
    div.className = "meta";
    div.textContent = `Candidați: ${turn.candidates.join(", ")} · siguranță ${Math.round(turn.confidence * 100)}%`;
    chat.appendChild(div);
  }

  function renderButtons(turn) {
    answers.innerHTML = "";
    const done = turn?.kind === "done";
    const labels = done ? [] : turn?.kind === "guess" ? GUESS_ANSWERS : QUESTION_ANSWERS;
    for (const label of labels) {
      const b = document.createElement("button");
      b.textContent = label;
      b.disabled = busy;
      b.onclick = () => answer(label);
      answers.appendChild(b);
    }
    const restart = document.createElement("button");
    restart.textContent = "Joc nou";
    restart.className = done ? "primary" : "";
    restart.disabled = busy;
    restart.onclick = startGame;
    answers.appendChild(restart);
    form.style.display = done ? "none" : "flex";
    textInput.disabled = busy;
  }

  async function requestTurn() {
    busy = true;
    renderButtons(lastTurn);
    const thinking = addBubble("…", "bot");
    try {
      const res = await fetch("/api/turn", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ history }),
      });
      const data = await res.json();
      thinking.remove();
      if (!res.ok) throw new Error(data.error || "Eroare necunoscută.");
      lastTurn = data;
      history.push({ role: "assistant", content: JSON.stringify(data) });
      addBubble(data.message, "bot");
      addMeta(data);
    } catch (err) {
      thinking.remove();
      // Scoatem ultimul răspuns al jucătorului ca să poată reîncerca.
      if (history.length && history[history.length - 1].role === "user") history.pop();
      const e = addBubble(err.message + " Apasă din nou pe un răspuns.", "bot");
      e.classList.add("error");
    } finally {
      busy = false;
      renderButtons(lastTurn);
      if (lastTurn?.kind !== "done") textInput.focus();
    }
  }

  function answer(text) {
    if (busy || !text.trim() || lastTurn?.kind === "done") return;
    if (!lastTurn) return startGame();
    history.push({ role: "user", content: text.trim() });
    addBubble(text.trim(), "me");
    requestTurn();
  }

  function startGame() {
    history = [];
    lastTurn = null;
    chat.innerHTML = "";
    requestTurn();
  }

  form.addEventListener("submit", (e) => {
    e.preventDefault();
    answer(textInput.value);
    textInput.value = "";
  });

  startGame();
</script>
</body>
</html>
