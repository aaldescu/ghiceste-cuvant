<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ghicește cuvântul</title>
<style>
  :root {
    --bg: #f6f5f1; --panel: #ffffff; --text: #1d1d1b; --muted: #6b6a66;
    --accent: #c2572b; --bot: #efece4; --me: #c2572b; --me-text: #fff; --border: #e2dfd6;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1a1918; --panel: #232220; --text: #eeece6; --muted: #9d9a92;
      --accent: #e07a4f; --bot: #2e2c29; --me: #b8532a; --me-text: #fff; --border: #3a3834;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 640px; margin: 0 auto; padding: 16px; min-height: 100vh;
    display: flex; flex-direction: column; gap: 12px; }
  header h1 { margin: 8px 0 0; font-size: 1.5rem; }
  header p { margin: 4px 0 0; color: var(--muted); font-size: .95rem; }
  #chat { flex: 1; display: flex; flex-direction: column; gap: 8px; padding: 8px 0; }
  .msg { max-width: 85%; padding: 10px 14px; border-radius: 16px; white-space: pre-wrap; }
  .bot { background: var(--bot); align-self: flex-start; border-bottom-left-radius: 4px; }
  .me { background: var(--me); color: var(--me-text); align-self: flex-end; border-bottom-right-radius: 4px; }
  .meta { font-size: .8rem; color: var(--muted); align-self: flex-start; margin-top: -4px; }
  .error { color: #d33; font-size: .9rem; }
  #panel { position: sticky; bottom: 0; background: var(--bg); padding: 8px 0 16px;
    display: flex; flex-direction: column; gap: 8px; }
  .buttons { display: flex; flex-wrap: wrap; gap: 8px; }
  .buttons:empty { display: none; }
  button { font: inherit; border: 1px solid var(--border); background: var(--panel); color: var(--text);
    padding: 8px 14px; border-radius: 999px; cursor: pointer; }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  button:disabled { opacity: .5; cursor: default; }
  form { display: flex; gap: 8px; }
  #text { flex: 1; min-width: 0; font: inherit; padding: 8px 14px; border-radius: 999px;
    border: 1px solid var(--border); background: var(--panel); color: var(--text); }
  label.hint { font-size: .85rem; color: var(--muted); display: flex; gap: 6px; align-items: center; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Ghicește cuvântul</h1>
    <p>Gândește-te la un cuvânt și descrie-l, fără să-l spui. Eu încerc să-l ghicesc.</p>
  </header>

  <div id="chat" aria-live="polite"></div>

  <div id="panel">
    <div class="buttons" id="answers"></div>
    <form id="free">
      <input id="text" placeholder="Descrie cuvântul, fără să-l spui…" autocomplete="off" maxlength="300">
      <button type="submit">Trimite</button>
    </form>
    <div class="buttons"><button id="restart">Joc nou</button></div>
    <label class="hint"><input type="checkbox" id="showCandidates"> Arată la ce cuvinte mă gândesc</label>
  </div>
</main>

<script>
  const OPENING = "Gata, m-am pregătit. Spune-mi ceva despre cuvântul tău, dar nu-l spune!";

  const chat = document.getElementById("chat");
  const buttons = document.getElementById("answers");
  const form = document.getElementById("free");
  const textInput = document.getElementById("text");
  const restart = document.getElementById("restart");
  const showCandidates = document.getElementById("showCandidates");

  // Starea jocului e ținută doar în pagină. Cuvântul jucătorului nu apare nicăieri.
  let conversation = []; // [{from: "player" | "game", text}]
  let rejected = [];     // ghiciri greșite
  let lastTurn = null;
  let busy = false;

  function addBubble(text, who) {
    const div = document.createElement("div");
    div.className = "msg " + who;
    div.textContent = text;
    chat.appendChild(div);
    div.scrollIntoView({ behavior: "smooth", block: "end" });
    return div;
  }

  function addMeta(text) {
    const div = document.createElement("div");
    div.className = "meta";
    div.textContent = text;
    chat.appendChild(div);
  }

  function addError(message) {
    addBubble(message, "bot").classList.add("error");
  }

  function finished() {
    return lastTurn && (lastTurn.kind === "done" || lastTurn.kind === "giveup");
  }

  function render() {
    buttons.innerHTML = "";
    if (lastTurn && lastTurn.kind === "guess") {
      for (const [label, yes] of [["Da, ai ghicit!", true], ["Nu", false]]) {
        const b = document.createElement("button");
        b.textContent = label;
        b.disabled = busy;
        b.onclick = () => send(label, yes);
        buttons.appendChild(b);
      }
    }
    restart.className = finished() ? "primary" : "";
    restart.disabled = busy;
    form.style.display = finished() ? "none" : "flex";
    textInput.disabled = busy;
  }

  async function post(url, body) {
    const res = await fetch(url, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || "Eroare necunoscută.");
    return data;
  }

  // guessAnswer: true / false de la butoane; null când jucătorul scrie liber (atunci decide Jev).
  async function send(text, guessAnswer = null) {
    text = text.trim();
    if (busy || finished() || !text) return;
    addBubble(text, "me");
    conversation.push({ from: "player", text });
    busy = true;
    render();
    try {
      const turn = await post("/api/turn", {
        conversation,
        rejected,
        guess: lastTurn && lastTurn.kind === "guess" ? lastTurn.guess : null,
        guess_answer: guessAnswer,
      });
      lastTurn = turn;
      rejected = turn.rejected;
      conversation.push({ from: "game", text: turn.message });
      addBubble(turn.message, "bot");
      if (showCandidates.checked && turn.candidates) {
        addMeta(`Candidați: ${turn.candidates.join(", ")} · siguranță ${Math.round(turn.confidence * 100)}%`);
      }
    } catch (err) {
      // Scoatem mesajul din conversație, ca jucătorul să-l poată trimite din nou.
      conversation.pop();
      addError(err.message + " Mai încearcă.");
    } finally {
      busy = false;
      render();
      if (!finished()) textInput.focus();
    }
  }

  function startGame() {
    conversation = [{ from: "game", text: OPENING }];
    rejected = [];
    lastTurn = null;
    chat.innerHTML = "";
    addBubble(OPENING, "bot");
    render();
    textInput.focus();
  }

  form.addEventListener("submit", (e) => {
    e.preventDefault();
    const text = textInput.value;
    textInput.value = "";
    send(text);
  });
  restart.addEventListener("click", startGame);

  startGame();
</script>
</body>
</html>
