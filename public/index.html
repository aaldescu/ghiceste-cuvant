<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ghicește cuvântul</title>
<style>
  :root {
    --bg: #f6f5f1; --panel: #ffffff; --text: #1d1d1b; --muted: #6b6a66;
    --accent: #c2572b; --bot: #efece4; --me: #c2572b; --me-text: #fff; --border: #e2dfd6;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1a1918; --panel: #232220; --text: #eeece6; --muted: #9d9a92;
      --accent: #e07a4f; --bot: #2e2c29; --me: #b8532a; --me-text: #fff; --border: #3a3834;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 640px; margin: 0 auto; padding: 16px; min-height: 100vh;
    display: flex; flex-direction: column; gap: 12px; }
  header h1 { margin: 8px 0 0; font-size: 1.5rem; }
  header p { margin: 4px 0 0; color: var(--muted); font-size: .95rem; }
  #chat { flex: 1; display: flex; flex-direction: column; gap: 8px; padding: 8px 0; }
  .msg { max-width: 85%; padding: 10px 14px; border-radius: 16px; white-space: pre-wrap; }
  .bot { background: var(--bot); align-self: flex-start; border-bottom-left-radius: 4px; }
  .me { background: var(--me); color: var(--me-text); align-self: flex-end; border-bottom-right-radius: 4px; }
  .meta { font-size: .8rem; color: var(--muted); align-self: flex-start; margin-top: -4px; }
  .error { color: #d33; font-size: .9rem; }
  #panel { position: sticky; bottom: 0; background: var(--bg); padding: 8px 0 16px;
    display: flex; flex-direction: column; gap: 8px; }
  .buttons { display: flex; flex-wrap: wrap; gap: 8px; }
  button { font: inherit; border: 1px solid var(--border); background: var(--panel); color: var(--text);
    padding: 8px 14px; border-radius: 999px; cursor: pointer; }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  button:disabled { opacity: .5; cursor: default; }
  form { display: flex; gap: 8px; }
  #text { flex: 1; min-width: 0; font: inherit; padding: 8px 14px; border-radius: 999px;
    border: 1px solid var(--border); background: var(--panel); color: var(--text); }
  label.hint { font-size: .85rem; color: var(--muted); display: flex; gap: 6px; align-items: center; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Ghicește cuvântul</h1>
    <p>Gândește-te la un cuvânt și nu-l scrie nicăieri. Eu pun întrebări și încerc să-l ghicesc.</p>
  </header>

  <div id="chat" aria-live="polite"></div>

  <div id="panel">
    <div class="buttons" id="answers"></div>
    <form id="free">
      <input id="text" placeholder="Sau răspunde liber…" autocomplete="off" maxlength="300">
      <button type="submit">Trimite</button>
    </form>
    <label class="hint"><input type="checkbox" id="showCandidates"> Arată la ce cuvinte mă gândesc</label>
  </div>
</main>

<script>
  // Cât de „da" e fiecare buton: 1 = da, 0 = nu.
  const QUESTION_ANSWERS = [["Da", 1], ["Nu", 0], ["Nu știu", 0.5], ["Probabil", 0.75], ["Probabil nu", 0.25]];
  const GUESS_ANSWERS = [["Da, ai ghicit!", 1], ["Nu", 0]];

  const chat = document.getElementById("chat");
  const buttons = document.getElementById("answers");
  const form = document.getElementById("free");
  const textInput = document.getElementById("text");
  const showCandidates = document.getElementById("showCandidates");

  // Starea jocului e ținută doar în pagină: răspunsurile ca numere, nu cuvântul jucătorului.
  let answers = [];   // [{q: id_întrebare, y: 0..1}]
  let rejected = [];  // ghiciri greșite
  let lastTurn = null;
  let busy = false;

  function addBubble(text, who) {
    const div = document.createElement("div");
    div.className = "msg " + who;
    div.textContent = text;
    chat.appendChild(div);
    div.scrollIntoView({ behavior: "smooth", block: "end" });
    return div;
  }

  function addMeta(text) {
    const div = document.createElement("div");
    div.className = "meta";
    div.textContent = text;
    chat.appendChild(div);
  }

  function addError(message) {
    addBubble(message, "bot").classList.add("error");
  }

  function finished() {
    return lastTurn && (lastTurn.kind === "done" || lastTurn.kind === "giveup");
  }

  function renderButtons() {
    buttons.innerHTML = "";
    const options = finished() || !lastTurn ? [] : lastTurn.kind === "guess" ? GUESS_ANSWERS : QUESTION_ANSWERS;
    for (const [label, y] of options) {
      const b = document.createElement("button");
      b.textContent = label;
      b.disabled = busy;
      b.onclick = () => answer(label, y);
      buttons.appendChild(b);
    }
    const restart = document.createElement("button");
    restart.textContent = "Joc nou";
    restart.className = finished() ? "primary" : "";
    restart.disabled = busy;
    restart.onclick = startGame;
    buttons.appendChild(restart);
    form.style.display = finished() ? "none" : "flex";
    textInput.disabled = busy;
  }

  async function post(url, body) {
    const res = await fetch(url, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || "Eroare necunoscută.");
    return data;
  }

  function setBusy(value) {
    busy = value;
    renderButtons();
  }

  // undo: anulează ultimul răspuns dacă serverul nu răspunde, ca jucătorul să poată reîncerca.
  async function requestTurn(undo) {
    setBusy(true);
    try {
      lastTurn = await post("/api/turn", { answers, rejected });
      addBubble(lastTurn.message, "bot");
      if (showCandidates.checked && lastTurn.candidates) {
        addMeta(`Candidați: ${lastTurn.candidates.join(", ")} · siguranță ${Math.round(lastTurn.confidence * 100)}%`);
      }
    } catch (err) {
      if (undo) undo();
      addError(err.message + " Mai încearcă.");
    } finally {
      setBusy(false);
      if (!finished()) textInput.focus();
    }
  }

  // y: cât de „da" e răspunsul (0..1).
  function applyAnswer(y) {
    if (lastTurn.kind === "guess") {
      if (y >= 0.5) {
        lastTurn = { kind: "done" };
        addBubble(`Am ghicit din ${answers.length} întrebări! Mai jucăm?`, "bot");
        renderButtons();
        return;
      }
      rejected.push(lastTurn.guess);
      requestTurn(() => rejected.pop());
    } else {
      answers.push({ q: lastTurn.question_id, y });
      requestTurn(() => answers.pop());
    }
  }

  function answer(label, y) {
    if (busy || !lastTurn || finished()) return;
    addBubble(label, "me");
    applyAnswer(y);
  }

  // Răspuns liber: Jev (clasificator one-shot) decide dacă e da, nu sau ceva între.
  async function answerFreeText(text) {
    if (busy || !lastTurn || finished() || !text.trim()) return;
    addBubble(text.trim(), "me");
    setBusy(true);
    const body = lastTurn.kind === "guess"
      ? { guess: lastTurn.guess, text }
      : { q: lastTurn.question_id, text };
    let result;
    try {
      result = await post("/api/classify", body);
    } catch (err) {
      addError(err.message);
      setBusy(false);
      return;
    }
    if (showCandidates.checked) {
      addMeta(`Jev a înțeles: ${result.label.replace("_", " ")} (${Math.round(result.confidence * 100)}%)`);
    }
    busy = false;
    applyAnswer(result.y);
  }

  function startGame() {
    answers = [];
    rejected = [];
    lastTurn = null;
    chat.innerHTML = "";
    requestTurn();
  }

  form.addEventListener("submit", (e) => {
    e.preventDefault();
    const text = textInput.value;
    textInput.value = "";
    answerFreeText(text);
  });

  startGame();
</script>
</body>
</html>
